name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SUBDIR: art-explorer   # <— set this to the folder that contains firebase.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: List files at repo root (debug)
        run: ls -la

      - name: List files in subdir (debug)
        run: ls -la "$SUBDIR"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install deps
        working-directory: ${{ env.SUBDIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.SUBDIR }}
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_TOKEN }}'
          channelId: live
          entryPoint: ${{ env.SUBDIR }}   # <— tell the action where firebase.json is
